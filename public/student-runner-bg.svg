<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Student gradient -->
    <linearGradient id="studentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Backpack gradient -->
    <linearGradient id="backpackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Building gradient -->
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Campus buildings in background -->
  <g opacity="0.3">
    <!-- Building 1 -->
    <rect x="50" y="200" width="80" height="200" fill="url(#buildingGradient)" rx="4"/>
    <rect x="60" y="220" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    <rect x="80" y="220" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    <rect x="100" y="220" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    <rect x="60" y="250" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    <rect x="80" y="250" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    <rect x="100" y="250" width="12" height="15" fill="#94a3b8" opacity="0.6"/>
    
    <!-- Building 2 -->
    <rect x="650" y="150" width="100" height="250" fill="url(#buildingGradient)" rx="4"/>
    <rect x="665" y="170" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
    <rect x="690" y="170" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
    <rect x="715" y="170" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
    <rect x="665" y="210" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
    <rect x="690" y="210" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
    <rect x="715" y="210" width="15" height="18" fill="#94a3b8" opacity="0.6"/>
  </g>
  
  <!-- Trees -->
  <g opacity="0.4">
    <ellipse cx="200" cy="380" rx="25" ry="35" fill="#22c55e"/>
    <rect x="195" y="380" width="10" height="30" fill="#92400e"/>
    
    <ellipse cx="600" cy="390" rx="30" ry="40" fill="#16a34a"/>
    <rect x="594" y="390" width="12" height="35" fill="#92400e"/>
  </g>
  
  <!-- Walking path -->
  <path d="M 0 450 Q 200 430 400 440 T 800 450" stroke="#e2e8f0" stroke-width="60" fill="none" opacity="0.5"/>
  
  <!-- Student runner figure -->
  <g transform="translate(350, 300)">
    <!-- Shadow -->
    <ellipse cx="20" cy="140" rx="25" ry="8" fill="#000000" opacity="0.1"/>
    
    <!-- Legs (running position) -->
    <g fill="url(#studentGradient)">
      <!-- Left leg (back) -->
      <rect x="10" y="100" width="8" height="35" rx="4" transform="rotate(-20 14 100)"/>
      <rect x="8" y="130" width="8" height="25" rx="4" transform="rotate(15 12 130)"/>
      
      <!-- Right leg (front) -->
      <rect x="25" y="95" width="8" height="35" rx="4" transform="rotate(25 29 95)"/>
      <rect x="30" y="125" width="8" height="25" rx="4" transform="rotate(-10 34 125)"/>
    </g>
    
    <!-- Shoes -->
    <ellipse cx="15" cy="155" rx="8" ry="4" fill="#1f2937"/>
    <ellipse cx="35" cy="148" rx="8" ry="4" fill="#1f2937"/>
    
    <!-- Body -->
    <rect x="15" y="60" width="20" height="45" rx="10" fill="url(#studentGradient)"/>
    
    <!-- Backpack -->
    <rect x="8" y="65" width="15" height="25" rx="7" fill="url(#backpackGradient)"/>
    <rect x="10" y="68" width="3" height="8" fill="#065f46"/>
    <rect x="15" y="68" width="3" height="8" fill="#065f46"/>
    
    <!-- Arms (running motion) -->
    <g fill="url(#studentGradient)">
      <!-- Left arm (back) -->
      <rect x="5" y="65" width="6" height="25" rx="3" transform="rotate(-30 8 65)"/>
      <rect x="2" y="85" width="6" height="20" rx="3" transform="rotate(20 5 85)"/>
      
      <!-- Right arm (front) -->
      <rect x="35" y="70" width="6" height="25" rx="3" transform="rotate(40 38 70)"/>
      <rect x="40" y="90" width="6" height="20" rx="3" transform="rotate(-15 43 90)"/>
    </g>
    
    <!-- Hands -->
    <circle cx="8" cy="105" r="4" fill="#fbbf24"/>
    <circle cx="45" cy="95" r="4" fill="#fbbf24"/>
    
    <!-- Head -->
    <circle cx="25" cy="45" r="15" fill="#fbbf24"/>
    
    <!-- Hair -->
    <path d="M 15 35 Q 25 25 35 35 Q 30 30 25 32 Q 20 30 15 35" fill="#92400e"/>
    
    <!-- Face -->
    <circle cx="22" cy="42" r="1.5" fill="#1f2937"/>
    <circle cx="28" cy="42" r="1.5" fill="#1f2937"/>
    <path d="M 22 48 Q 25 50 28 48" stroke="#1f2937" stroke-width="1" fill="none"/>
    
    <!-- Package/books in hand -->
    <rect x="42" y="88" width="8" height="6" rx="1" fill="#f59e0b"/>
    <rect x="43" y="89" width="6" height="1" fill="#d97706"/>
  </g>
  
  <!-- Motion lines -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.3" fill="none">
    <path d="M 320 350 Q 330 345 340 350"/>
    <path d="M 315 360 Q 325 355 335 360"/>
    <path d="M 310 370 Q 320 365 330 370"/>
  </g>
  
  <!-- Floating elements (representing errands/tasks) -->
  <g opacity="0.6">
    <!-- Coffee cup -->
    <g transform="translate(150, 200)">
      <rect x="0" y="5" width="12" height="15" rx="2" fill="#8b5cf6"/>
      <rect x="1" y="6" width="10" height="12" fill="#a78bfa"/>
      <path d="M 12 10 Q 16 10 16 14 Q 16 18 12 18" stroke="#8b5cf6" stroke-width="1" fill="none"/>
    </g>
    
    <!-- Book -->
    <g transform="translate(550, 180)">
      <rect x="0" y="0" width="15" height="20" rx="1" fill="#ef4444"/>
      <rect x="2" y="2" width="11" height="16" fill="#f87171"/>
      <line x1="2" y1="6" x2="13" y2="6" stroke="#dc2626" stroke-width="0.5"/>
      <line x1="2" y1="10" x2="13" y2="10" stroke="#dc2626" stroke-width="0.5"/>
    </g>
    
    <!-- Shopping bag -->
    <g transform="translate(480, 250)">
      <rect x="2" y="5" width="16" height="18" rx="2" fill="#10b981"/>
      <path d="M 6 5 Q 6 2 10 2 Q 14 2 14 5" stroke="#10b981" stroke-width="2" fill="none"/>
      <rect x="4" y="8" width="12" height="2" fill="#059669"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <g fill="#6366f1" opacity="0.2">
    <circle cx="100" cy="100" r="3"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="250" cy="150" r="2.5"/>
    <circle cx="650" cy="300" r="3"/>
    <circle cx="150" cy="350" r="2"/>
  </g>
</svg>